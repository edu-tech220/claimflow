name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ClaimFlow.sln

      - name: Build
        run: dotnet build ClaimFlow.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test ClaimFlow.sln --no-build --configuration Release --verbosity normal

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f src/ClaimFlow.Api/Dockerfile -t claimflow-api:ci .

      - name: Build Web image
        run: docker build -f src/ClaimFlow.Web/Dockerfile -t claimflow-web:ci .
