services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ClaimFlow_Sql123!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/ClaimFlow.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ClaimFlow: "Server=sqlserver,1433;Database=ClaimFlowDb;User Id=sa;Password=ClaimFlow_Sql123!;TrustServerCertificate=True;"
      Jwt__SigningKey: "docker-compose-dev-signing-key-change-me-32bytes+"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: src/ClaimFlow.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Api__BaseUrl: "http://api:8080"
    ports:
      - "8081:8080"
    depends_on:
      - api

volumes:
  sqlserver-data:
